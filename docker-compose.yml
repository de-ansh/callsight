name: callsight

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callsight-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-callsight}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callsight} -d ${POSTGRES_DB:-callsight}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing free images (minio/minio is gone from Docker Hub); this is Chainguard's
    # rebuild of current MinIO. Pinned by digest: bump deliberately.
    image: cgr.dev/chainguard/minio@sha256:aea6c163749e1caca37f907976dcf337177ddf5f558808f2aa591618fd3a6eef
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-callsight}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-callsight-dev-only}
    volumes:
      - minio-data:/data
    ports:  # only for the MinIO console / local debugging; the API reaches MinIO on the internal network
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    environment: &callsight-env
      CALLSIGHT_DATABASE_URL: postgresql://${POSTGRES_USER:-callsight}:${POSTGRES_PASSWORD:-callsight-dev-only}@db:5432/${POSTGRES_DB:-callsight}
      CALLSIGHT_LLM_PROVIDER: ${CALLSIGHT_LLM_PROVIDER:-none}
      CALLSIGHT_OLLAMA_URL: ${CALLSIGHT_OLLAMA_URL:-http://ollama:11434}
      CALLSIGHT_OLLAMA_MODEL: ${CALLSIGHT_OLLAMA_MODEL:-llama3.1}
      CALLSIGHT_COMPETITORS: ${CALLSIGHT_COMPETITORS:-}
      CALLSIGHT_REP_NAMES: ${CALLSIGHT_REP_NAMES:-}
      CALLSIGHT_S3_ENDPOINT: minio:9000
      CALLSIGHT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-callsight}
      CALLSIGHT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-callsight-dev-only}
      CALLSIGHT_WHISPER_MODEL: ${CALLSIGHT_WHISPER_MODEL:-small}
      CALLSIGHT_SECRET_KEY: ${CALLSIGHT_SECRET_KEY:-}
      CALLSIGHT_RETENTION_DAYS: ${CALLSIGHT_RETENTION_DAYS:-0}
      CALLSIGHT_PUBLIC_URL: ${CALLSIGHT_PUBLIC_URL:-http://localhost:8000}
      CALLSIGHT_OIDC_ISSUER: ${CALLSIGHT_OIDC_ISSUER:-}
      CALLSIGHT_OIDC_CLIENT_ID: ${CALLSIGHT_OIDC_CLIENT_ID:-}
      CALLSIGHT_OIDC_CLIENT_SECRET: ${CALLSIGHT_OIDC_CLIENT_SECRET:-}
      CALLSIGHT_ANALYZERS: ${CALLSIGHT_ANALYZERS:-}
    depends_on: &callsight-deps
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${CALLSIGHT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Transcribes and analyzes uploaded recordings. Scale with: docker compose up --scale worker=2
  worker:
    build: ./services/api
    command: ["python", "-m", "callsight.worker"]
    environment: *callsight-env
    depends_on: *callsight-deps
    volumes:
      - whisper-cache:/home/appuser/.cache

  # Optional local LLM. Start with: docker compose --profile local-llm up
  ollama:
    image: ollama/ollama
    profiles: ["local-llm"]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  db-data:
  minio-data:
  ollama-data:
  whisper-cache:

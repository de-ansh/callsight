<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callsight</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --raised: #fbfbf9; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3dd;
    --accent: #2f5bd3; --on-accent: #ffffff; --accent-soft: #e8eefc;
    --high: #b42318; --high-soft: #fdecea; --medium: #9a5b06; --medium-soft: #fdf3e2;
    --low: #3f6212; --low-soft: #edf5e3; --info: #475467; --info-soft: #eef0f3;
    --mark: #fff1b8; --spk-a: #2f5bd3; --spk-b: #b5179e;
    --bar: #2f5bd3; --grid: #ecebe6;  /* chart mark: validated vs the light panel (dataviz validator) */
    --radius: 10px; --shadow: 0 1px 2px rgba(20, 20, 18, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --raised: #232321; --text: #ecebe6; --muted: #a3a29b; --line: #33322e;
      --accent: #8aa8ff; --on-accent: #10172e; --accent-soft: #232c45;
      --high: #ff8a80; --high-soft: #3a1f1d; --medium: #f5b955; --medium-soft: #372b17;
      --low: #a3d97a; --low-soft: #223019; --info: #b8c0cc; --info-soft: #262a30;
      --mark: #4a3f10; --spk-a: #8aa8ff; --spk-b: #f08bdc; --shadow: none;
      --bar: #6b8ff2; --grid: #2a2a27;  /* the UI accent #8aa8ff is too light for marks on dark */
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 70px; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; border-radius: 7px; }
  button:disabled { opacity: .5; cursor: default; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }

  /* ----- header */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px;
           padding: 0 20px; height: 54px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 17px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .brand:hover { text-decoration: none; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); padding: 6px 10px; border-radius: 7px; font-size: 14px; }
  nav a:hover { color: var(--text); background: var(--raised); text-decoration: none; }
  nav a[aria-current="page"] { color: var(--text); background: var(--accent-soft); font-weight: 600; }
  .spacer { flex: 1; }
  .version { color: var(--muted); font-size: 12px; }
  .linklike { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 6px 8px; }
  .linklike:hover { color: var(--text); }
  @media (max-width: 640px) { .version, .linklike { display: none; } header { gap: 10px; padding: 0 12px; } }

  main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 64px; }
  .page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .count { color: var(--muted); font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
           box-shadow: var(--shadow); padding: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .msg { font-size: 13px; min-height: 1.2em; margin-top: 8px; }
  .error { color: var(--high); }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }

  /* ----- buttons, inputs */
  .btn { padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .btn:hover { background: var(--raised); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { border-color: var(--high); color: var(--high); background: none; }
  .btn.danger:hover { background: var(--high-soft); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=search], textarea, select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--raised); color: var(--text); font: inherit; }
  textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  input[type=file] { font-size: 14px; color: var(--muted); max-width: 100%; }

  /* ----- add-a-call panel */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px -4px 4px; }
  .tab { border: 0; background: none; color: var(--muted); padding: 8px 12px; border-radius: 7px 7px 0 0;
         border-bottom: 2px solid transparent; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .add { margin-bottom: 16px; }
  .add-row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .add-row > div { flex: 1; min-width: 220px; }

  /* ----- calls table */
  .toolbar { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar select { width: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--raised); }
  tbody tr:last-child td { border-bottom: 0; }
  .callname { font-weight: 600; color: var(--text); }
  .sub { display: block; color: var(--muted); font-size: 12px; }
  @media (max-width: 720px) { .hide-sm { display: none; } }

  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
          margin-right: 4px; white-space: nowrap; }
  .c-high { color: var(--high); background: var(--high-soft); }
  .c-medium { color: var(--medium); background: var(--medium-soft); }
  .c-low { color: var(--low); background: var(--low-soft); }
  .c-info { color: var(--info); background: var(--info-soft); }
  .status { font-size: 12px; font-weight: 600; text-transform: capitalize; white-space: nowrap; }
  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                    margin-right: 6px; background: currentColor; vertical-align: 1px; }
  .st-done { color: var(--low); } .st-failed { color: var(--high); }
  .st-queued, .st-processing { color: var(--medium); }

  /* ----- call page */
  .detail { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .detail { grid-template-columns: 1fr; } }
  .summary p { margin: 0 0 12px; }
  .talk { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 6px 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .group { margin-top: 16px; }
  .group-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
                 margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
  .insight { padding: 10px 12px; border: 1px solid var(--line); border-left-width: 3px; border-radius: 8px;
             margin-bottom: 8px; background: var(--panel); }
  .insight.s-high { border-left-color: var(--high); } .insight.s-medium { border-left-color: var(--medium); }
  .insight.s-low { border-left-color: var(--low); } .insight.s-info { border-left-color: var(--line); }
  .insight .title { font-weight: 600; }
  .insight .why { color: var(--muted); font-size: 13px; }
  .ev { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 6px 8px; font-size: 13px;
        border: 1px solid var(--line); background: var(--raised); color: var(--text); }
  .ev:hover { border-color: var(--accent); }
  .ts { font-family: ui-monospace, Menlo, monospace; color: var(--accent); font-size: 12px; }
  .player { position: sticky; top: 66px; z-index: 2; background: var(--panel); padding-bottom: 8px; }
  audio { width: 100%; }
  .transcript { max-height: calc(100vh - 220px); overflow-y: auto; }
  .seg { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 8px; border-radius: 7px; }
  .seg.hit { background: var(--mark); }
  .seg button.ts { border: 0; background: none; padding: 2px 0; text-align: left; }
  .speaker { font-weight: 600; margin-right: 4px; }
  .spk-0 { color: var(--spk-a); } .spk-1 { color: var(--spk-b); }

  .speakers { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .spk-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 6px; }
  .spk-row label { margin: 0; display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; white-space: nowrap; }
  .row-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }

  /* ----- trends */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile .num { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .lbl { color: var(--muted); font-size: 13px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .chart-head { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; margin-bottom: 12px; }
  .chart-head h2 { margin: 0; }
  .chart-head .meta { grid-column: 1; }
  .chart-head .linkish { grid-column: 2; grid-row: 1; }
  .hbar { display: grid; grid-template-columns: minmax(140px, 45%) 1fr; gap: 2px 10px; align-items: center; }
  .hbar .name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { display: flex; align-items: center; gap: 8px; height: 22px; outline-offset: 1px; }
  .hbar .fill { height: 14px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--grid);
          background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 35px; }
  .cols .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
               height: 100%; outline-offset: 1px; }
  .cols .col span { display: block; width: 100%; max-width: 28px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
  .cols-axis { display: flex; gap: 2px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .cols-axis span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }
  .tooltip { position: fixed; z-index: 20; pointer-events: none; background: var(--text); color: var(--bg);
             font-size: 12px; padding: 5px 8px; border-radius: 6px; max-width: 240px; }
  .seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg-ctl button { border: 0; border-radius: 0; background: var(--panel); color: var(--muted); padding: 6px 12px; font-size: 13px; }
  .seg-ctl button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .linkish { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 0; white-space: nowrap; align-self: start; }

  /* ----- print: a clean one-page call summary */
  @media print {
    header, .no-print, .player, .speakers, .seg button.ts { display: none !important; }
    body { background: #fff; color: #000; }
    main { padding: 0; max-width: none; }
    .panel { box-shadow: none; border-color: #ccc; break-inside: avoid; }
    .detail { grid-template-columns: 1fr; }
    .transcript { max-height: none; overflow: visible; }
    .ev { border-color: #ccc; }
  }

  /* ----- settings, sign-in */
  .narrow { max-width: 640px; }
  .help { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/"><span class="dot" aria-hidden="true"></span>Callsight</a>
  <nav aria-label="Main">
    <a href="#/" data-nav="calls">Calls</a>
    <a href="#/trends" data-nav="trends">Trends</a>
    <a href="#/audit" data-nav="audit">Audit log</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <span class="spacer"></span>
  <span class="version" id="version"></span>
  <span class="version" id="whoami"></span>
  <button type="button" class="linklike" id="signout" hidden>Sign out</button>
</header>
<main id="app" aria-live="polite"></main>

<script>
"use strict";
// All call data is untrusted (transcripts come from customers): only ever set it via textContent.
const app = document.getElementById("app");
let pollTimer = null;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) {
    if (c === null || c === undefined || c === false || c === "") continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

function fmtTime(s) {
  s = Math.floor(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
const fmtDate = iso => new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
const short = id => String(id).slice(0, 8);

// The API key lives in this browser only (a per-viewer convenience); storage can be unavailable.
const KEY_STORE = "callsight.apiKey";
let sessionKey = "";
function getKey() { try { return localStorage.getItem(KEY_STORE) || sessionKey; } catch { return sessionKey; } }
function setKey(k) { sessionKey = k; try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch {} }

class AuthError extends Error {}

async function api(path, options = {}) {
  // The CSRF header lets the server accept writes authenticated by the sign-in cookie.
  const headers = { "x-callsight-csrf": "1", ...(options.headers || {}) };
  if (getKey()) headers.authorization = `Bearer ${getKey()}`;
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) throw new AuthError("Your API key is missing or no longer valid.");
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : null;
  if (!res.ok) {
    const d = body?.detail;
    throw new Error(!d ? `HTTP ${res.status}` : typeof d === "string" ? d : (Array.isArray(d) ? d.map(x => x.msg).join("; ") : JSON.stringify(d)));
  }
  return body;
}

function handle(e) {
  if (e instanceof AuthError) { showKeyForm(e.message); return true; }
  return false;
}

function setNav(page) {
  document.querySelectorAll("nav a").forEach(a => {
    if (a.dataset.nav === page) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function chip(sev, text) { return el("span", { class: `chip c-${sev}` }, text); }
function statusTag(s) { return el("span", { class: `status st-${s}` }, s); }

// ---------------------------------------------------------------- sign in
let me = null;  // { actor } once signed in (by SSO session or API key)
let ssoEnabled = false;

async function showKeyForm(reason) {
  clearTimeout(pollTimer);
  setNav("");
  me = null; updateIdentity();
  try { ssoEnabled = (await (await fetch("/auth/config")).json()).sso; } catch { ssoEnabled = false; }
  const input = el("input", { type: "text", id: "apikey", autocomplete: "off", spellcheck: "false", placeholder: "cs_…" });
  const keyForm = el("form", { onsubmit: e => { e.preventDefault(); setKey(input.value.trim()); route(); } },
    el("label", { for: "apikey" }, ssoEnabled ? "Or use an API key" : "API key"), input,
    el("p", { class: "help" }, "Ask your administrator for a key, or create one with ",
      el("code", {}, "python -m callsight.admin create-key --org <name> --name <you>"), "."),
    el("div", { style: "margin-top: 12px" }, el("button", { class: ssoEnabled ? "btn" : "btn primary", type: "submit" }, "Continue with key")));
  app.replaceChildren(el("section", { class: "panel narrow", style: "margin: 40px auto" },
    el("h1", { style: "margin-bottom: 12px" }, "Sign in to Callsight"),
    reason ? el("p", { class: "error" }, reason) : null,
    ssoEnabled ? el("a", { class: "btn primary", href: "/auth/login", style: "display: inline-block" }, "Sign in with SSO") : null,
    ssoEnabled ? el("p", { class: "help" }, "Use your company account. Your email domain must be enabled by an administrator.") : null,
    keyForm));
  if (!ssoEnabled) input.focus();
}

function updateIdentity() {
  document.getElementById("whoami").textContent = me ? me.actor.replace(/^user:/, "").replace(/^key:/, "key: ") : "";
  document.getElementById("signout").hidden = !me;
}

// ---------------------------------------------------------------- calls
function addCallPanel(onAdded) {
  const msg = el("div", { class: "msg", role: "status" });
  const fileInput = el("input", { type: "file", id: "file", accept: ".wav,.mp3,.m4a,.ogg,.flac,.webm,.mp4" });
  const audioName = el("input", { type: "text", id: "audio-name", placeholder: "e.g. acme-discovery-1" });
  const repName = el("input", { type: "text", id: "rep-name", placeholder: "e.g. Alex", maxlength: "40" });
  const customerName = el("input", { type: "text", id: "customer-name", placeholder: "e.g. Priya", maxlength: "40" });
  const repChannel = el("select", { id: "rep-channel" },
    el("option", { value: "left" }, "Left channel"), el("option", { value: "right" }, "Right channel"));
  const textName = el("input", { type: "text", id: "text-name", placeholder: "e.g. acme-discovery-1" });
  const transcript = el("textarea", { id: "transcript", placeholder: "[00:00] Alex: Thanks for joining\n[00:05] Priya: The price is too high" });

  async function submit(button, run) {
    button.disabled = true; msg.className = "msg"; msg.textContent = "Working…";
    try { msg.textContent = await run(); onAdded(); }
    catch (e) { if (!handle(e)) { msg.className = "msg error"; msg.textContent = e.message; } }
    finally { button.disabled = false; }
  }
  const uploadBtn = el("button", { class: "btn primary", type: "submit" }, "Upload and analyze");
  const pasteBtn = el("button", { class: "btn primary", type: "submit" }, "Analyze transcript");

  const uploadForm = el("form", { onsubmit: e => { e.preventDefault();
      if (!fileInput.files[0]) { msg.className = "msg error"; msg.textContent = "Choose a recording first."; return; }
      submit(uploadBtn, async () => {
        const form = new FormData();
        form.append("file", fileInput.files[0]);
        if (audioName.value.trim()) form.append("call_id", audioName.value.trim());
        form.append("rep_name", repName.value.trim());
        form.append("customer_name", customerName.value.trim());
        form.append("rep_channel", repChannel.value);
        await api("/v1/calls/upload", { method: "POST", body: form });
        fileInput.value = ""; audioName.value = "";
        return "Uploaded. Transcription runs in the background; the list updates by itself.";
      }); } },
    el("div", { class: "add-row" },
      el("div", {}, el("label", { for: "file" }, "Recording (wav, mp3, m4a, ogg, flac, webm, mp4)"), fileInput),
      el("div", {}, el("label", { for: "audio-name" }, "Call name (optional)"), audioName),
      uploadBtn),
    el("div", { class: "add-row" },
      el("div", {}, el("label", { for: "rep-name" }, "Rep's name (optional)"), repName),
      el("div", {}, el("label", { for: "customer-name" }, "Customer's name (optional)"), customerName),
      el("div", { style: "flex: 0 0 auto; min-width: 150px" }, el("label", { for: "rep-channel" }, "Rep is on the"), repChannel)),
    el("p", { class: "help" }, "Stereo phone recordings get one speaker per channel, and the names above label those channels. "
      + "For mono recordings, rename speakers on the call page afterwards. Nothing leaves your servers."));

  const pasteForm = el("form", { hidden: true, onsubmit: e => { e.preventDefault();
      submit(pasteBtn, async () => {
        const r = await api("/v1/analyze", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ call_id: textName.value.trim() || "pasted", transcript: transcript.value }) });
        location.hash = `#/calls/${r.id}`;
        return "Analyzed.";
      }); } },
    el("label", { for: "text-name" }, "Call name (optional)"), textName,
    el("label", { for: "transcript" }, "Transcript: one turn per line, [mm:ss] Speaker: text"), transcript,
    el("div", { style: "margin-top: 10px" }, pasteBtn));

  const tabs = [["Upload a recording", uploadForm], ["Paste a transcript", pasteForm]].map(([label, form], i) =>
    el("button", { class: "tab", type: "button", role: "tab", "aria-selected": i === 0 ? "true" : "false",
      onclick: e => {
        tabs.forEach(t => t.setAttribute("aria-selected", "false")); e.currentTarget.setAttribute("aria-selected", "true");
        uploadForm.hidden = form !== uploadForm; pasteForm.hidden = form !== pasteForm; msg.textContent = "";
      } }, label));
  return el("section", { class: "panel add", "aria-label": "Add a call" },
    el("div", { class: "tabs", role: "tablist" }, ...tabs), uploadForm, pasteForm, msg);
}

async function showCalls() {
  setNav("calls");
  const tbody = el("tbody");
  const count = el("span", { class: "count" });
  const search = el("input", { type: "search", placeholder: "Search call names and what was said…", "aria-label": "Search calls" });

// ---------------------------------------------------------------- one call
const GROUPS = [["Needs attention", ["high"]], ["Watch", ["medium"]], ["Notes", ["low", "info"]]];

async function showCall(id) {
  clearTimeout(pollTimer);
  setNav("calls");
  let call;
  try { call = await api(`/v1/calls/${encodeURIComponent(id)}`); }
  catch (e) {
    if (handle(e)) return;
    app.replaceChildren(el("a", { href: "#/" }, "← All calls"), el("p", { class: "error" }, e.message));
    return;
  }

  const delMsg = el("span", { class: "msg error" });
  const delBtn = el("button", { class: "btn danger", type: "button", onclick: async () => {
      if (!confirm("Delete this call, its transcript, insights and recording? This cannot be undone.")) return;
      delBtn.disabled = true;
      try { await api(`/v1/calls/${encodeURIComponent(call.id)}`, { method: "DELETE" }); location.hash = "#/"; }
      catch (e) { if (!handle(e)) { delMsg.textContent = e.message; delBtn.disabled = false; } }
    } }, "Delete call");
  const rerunBtn = call.status === "done" ? el("button", { class: "btn", type: "button",
      title: "Apply current settings (competitor list, rules, LLM) to this call", onclick: async () => {
        rerunBtn.disabled = true; rerunBtn.textContent = "Re-analyzing…";
        try { await api(`/v1/calls/${encodeURIComponent(call.id)}/reanalyze`, { method: "POST" }); showCall(id); }
        catch (e) { if (!handle(e)) { delMsg.textContent = e.message; rerunBtn.disabled = false; rerunBtn.textContent = "Re-run analysis"; } }
      } }, "Re-run analysis") : null;
  const head = el("div", {},
    el("a", { href: "#/", class: "no-print" }, "← All calls"),
    el("div", { class: "page-head", style: "margin-top: 8px" },
      el("h1", {}, call.call_id || short(call.id)), statusTag(call.status), el("span", { class: "spacer" }),
      el("span", { class: "no-print", style: "display: contents" }, delMsg,
        call.status === "done" ? el("button", { class: "btn", type: "button", onclick: () => window.print() }, "Print") : null,
        rerunBtn, delBtn)),
    el("p", { class: "meta", style: "margin: -8px 0 16px" },
      `${call.source} · ${call.duration_s == null ? "length unknown" : fmtTime(call.duration_s)} · added ${fmtDate(call.created_at)}`));

  if (call.status !== "done") {
    const why = call.status === "failed" ? el("p", { class: "error" }, call.error || "Processing failed.")
      : el("p", {}, "Transcribing and analyzing in the background. This page refreshes by itself.");
    app.replaceChildren(head, el("div", { class: "panel" }, why));
    if (call.status !== "failed") pollTimer = setTimeout(() => showCall(id), 4000);
    return;
  }

  const speakers = call.speakers || [];
  const spk = name => Math.max(0, speakers.indexOf(name)) % 2;
  const spkVar = name => (spk(name) === 0 ? "var(--spk-a)" : "var(--spk-b)");
  // A signed, expiring link: <audio> cannot send the Authorization header.
  const audio = call.recording_link ? el("audio", { controls: true, preload: "metadata", src: call.recording_link }) : null;

  const rows = new Map();
  const transcript = el("div", { class: "transcript", tabindex: "0", "aria-label": "Transcript" },
    ...call.segments.map(s => {
      const row = el("div", { class: "seg", id: `seg-${s.id}` },
        el("button", { class: "ts", type: "button", title: audio ? "Play from here" : "Highlight", onclick: () => jump(s.id, s.start_s) }, fmtTime(s.start_s)),
        el("div", {}, el("span", { class: `speaker spk-${spk(s.speaker)}` }, `${s.speaker}:`), s.text));
      rows.set(s.id, row);
      return row;
    }));

  function jump(segId, start) {
    rows.forEach(r => r.classList.remove("hit"));
    const row = rows.get(segId);
    if (row) { row.classList.add("hit"); row.scrollIntoView({ block: "center", behavior: "smooth" }); }
    if (audio) { audio.currentTime = start; audio.play().catch(() => {}); }
  }

  const share = Object.entries(call.talk_share || {});
  const talk = share.length ? el("div", {},
    el("div", { class: "talk", role: "img", "aria-label": share.map(([w, v]) => `${w} ${Math.round(v * 100)}%`).join(", ") },
      ...share.map(([who, v]) => el("span", { style: `width:${(v * 100).toFixed(1)}%; background:${spkVar(who)}` }))),
    el("div", { class: "legend" }, ...share.map(([who, v]) =>
      el("span", {}, el("i", { style: `background:${spkVar(who)}` }), `${who} ${Math.round(v * 100)}%`)))) : null;

  // Speakers: rename (e.g. "Speaker 1" -> "Alex") and say who the rep is; saving re-analyzes.
  const repGuess = call.rep_speaker || speakers[0];
  const spkInputs = speakers.map((name, i) => {
    const input = el("input", { type: "text", value: name, id: `spk-name-${i}`, "aria-label": `Name for ${name}`, maxlength: "40" });
    const radio = el("input", { type: "radio", name: "rep", value: String(i), checked: name === repGuess });
    return { name, input, radio, row: el("div", { class: "spk-row" }, input, el("label", {}, radio, "Rep")) };
  });
  const spkMsg = el("span", { class: "msg", role: "status" });
  const spkSave = el("button", { class: "btn", type: "submit" }, "Save and re-analyze");
  const speakerForm = speakers.length ? el("form", { class: "speakers", onsubmit: async e => {
      e.preventDefault();
      const names = {}; let rep = null;
      for (const s of spkInputs) {
        const v = s.input.value.trim();
        if (v && v !== s.name) names[s.name] = v;
        if (s.radio.checked) rep = v || s.name;
      }
      spkSave.disabled = true; spkMsg.className = "msg"; spkMsg.textContent = "Saving…";
      try {
        await api(`/v1/calls/${encodeURIComponent(call.id)}/speakers`, { method: "PUT",
          headers: { "content-type": "application/json" }, body: JSON.stringify({ names, rep }) });
        showCall(id);
      } catch (e) { if (!handle(e)) { spkMsg.className = "msg error"; spkMsg.textContent = e.message; spkSave.disabled = false; } }
    } },
    el("h2", {}, "Speakers"),
    el("p", { class: "help", style: "margin: -6px 0 8px" },
      call.rep_speaker ? "Rename speakers or change who the rep is." : "Who is the rep? (Guessed: whoever spoke first.)"),
    ...spkInputs.map(s => s.row),
    el("div", { class: "row-actions" }, spkSave, spkMsg)) : null;

  const insightCard = i => el("div", { class: `insight s-${i.severity}` },
    el("div", { class: "title" }, i.title),
    i.detail ? el("div", { class: "why" }, i.detail) : null,
    ...i.evidence.map(e => el("button", { class: "ev", type: "button", onclick: () => jump(e.segment_id, e.start_s),
        "aria-label": `Jump to ${fmtTime(e.start_s)}, ${e.speaker}` },
      el("span", { class: "ts" }, fmtTime(e.start_s)), " ", el("span", { class: `speaker spk-${spk(e.speaker)}` }, `${e.speaker}:`), `“${e.quote}”`)));
  const groups = GROUPS.map(([title, sevs]) => {
    const items = call.insights.filter(i => sevs.includes(i.severity));
    return items.length ? el("section", { class: "group", "aria-label": title },
      el("h2", { class: "group-title" }, title, chip(sevs[0], String(items.length))), ...items.map(insightCard)) : null;
  });

  app.replaceChildren(head,
    el("div", { class: "detail" },
      el("div", {},
        el("section", { class: "panel summary", "aria-label": "Summary" },
          el("h2", {}, "Summary"), el("p", {}, call.summary),
          talk ? el("h2", { style: "margin-top: 4px" }, "Talk share") : null, talk, speakerForm),
        call.insights.length ? el("div", {}, ...groups) : el("p", { class: "empty" }, "No insights for this call.")),
      el("section", { class: "panel", "aria-label": "Recording and transcript" },
        audio ? el("div", { class: "player" }, audio) : null, transcript)));
}

// ---------------------------------------------------------------- trends
const KIND_LABEL = {
  pricing_objection: "Pricing objection", timing_objection: "Timing objection",
  authority_objection: "Needs someone else's approval", need_objection: "Questions the need",
  competitor_mention: "Competitor mentioned", no_next_step: "No next step", talk_ratio: "Rep talked too much",
  sentiment_shift: "Sentiment shift",
};
const tip = el("div", { class: "tooltip", role: "tooltip", hidden: true });
document.body.append(tip);
function attachTip(node, text) {
  const show = e => {
    tip.textContent = text; tip.hidden = false;
    const r = node.getBoundingClientRect();
    const x = e && e.clientX ? e.clientX : r.left + r.width / 2, y = e && e.clientY ? e.clientY : r.top;
    tip.style.left = `${Math.min(x + 12, innerWidth - 250)}px`; tip.style.top = `${Math.max(8, y - 34)}px`;
  };
  node.addEventListener("mousemove", show); node.addEventListener("focus", () => show());
  node.addEventListener("mouseleave", () => (tip.hidden = true)); node.addEventListener("blur", () => (tip.hidden = true));
}

// One chart card: a title, the chart, and a "table" toggle so the numbers are readable without the bars.
function chartCard(title, subtitle, chart, rows, cols) {
  const table = el("table", { hidden: true },
    el("thead", {}, el("tr", {}, ...cols.map(c => el("th", {}, c[0])))),
    el("tbody", {}, ...rows.map(r => el("tr", {}, ...cols.map(c => el("td", {}, c[1](r)))))));
  const toggle = el("button", { class: "linkish", type: "button", onclick: () => {
    table.hidden = !table.hidden; chart.hidden = !table.hidden; toggle.textContent = table.hidden ? "Show as table" : "Show as chart";
  } }, "Show as table");
  return el("section", { class: "panel", "aria-label": title },
    el("div", { class: "chart-head" }, el("h2", {}, title), el("span", { class: "meta" }, subtitle), toggle),
    rows.length ? chart : el("p", { class: "empty" }, "Nothing in this period."), rows.length ? table : null);
}

function hbars(rows, label, value, total) {
  const max = Math.max(1, ...rows.map(value));
  return el("div", { class: "hbar" }, ...rows.flatMap(r => {
    const v = value(r), pct = total ? ` (${Math.round(100 * v / total)}%)` : "";
    const track = el("div", { class: "track", tabindex: "0", role: "img", "aria-label": `${label(r)}: ${v} calls${pct}` },
      el("div", { class: "fill", style: `width:${(100 * v / max).toFixed(1)}%` }), el("span", { class: "val" }, `${v}${pct}`));
    attachTip(track, `${label(r)}: ${v} call${v === 1 ? "" : "s"}${pct}`);
    return [el("div", { class: "name", title: label(r) }, label(r)), track];
  }));
}

function columns(rows) {
  const max = Math.max(1, ...rows.map(r => r.calls));
  const wk = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const bars = el("div", { class: "cols" }, ...rows.map(r => {
    const col = el("div", { class: "col", tabindex: "0", role: "img",
      "aria-label": `Week of ${wk(r.week)}: ${r.calls} calls, ${r.calls_with_high} with a high-severity flag` },
      el("span", { style: `height:${(100 * r.calls / max).toFixed(1)}%` }));
    attachTip(col, `Week of ${wk(r.week)}: ${r.calls} call${r.calls === 1 ? "" : "s"}, ${r.calls_with_high} with a high flag`);
    return col;
  }));
  // Label the first, middle and last week only; every column has its own tooltip.
  const keep = new Set([0, Math.floor((rows.length - 1) / 2), rows.length - 1]);
  return el("div", {}, bars, el("div", { class: "cols-axis", "aria-hidden": "true" },
    ...rows.map((r, i) => el("span", {}, keep.has(i) ? wk(r.week) : ""))));
}

          el("td", { class: "meta", style: "white-space: nowrap" },

function reanalyzeAllPanel() {
  const msg = el("div", { class: "msg", role: "status" });
  const btn = el("button", { class: "btn", type: "button", onclick: async () => {
    if (!confirm("Re-analyze every finished call with the current settings? Existing insights are replaced.")) return;
    btn.disabled = true;
    try { const r = await api("/v1/reanalysis", { method: "POST" }); poll(r.marked); }
    catch (e) { if (!handle(e)) { msg.className = "msg error"; msg.textContent = e.message; btn.disabled = false; } }
  } }, "Re-analyze all calls");
  async function poll(total) {
    try {
      const { pending } = await api("/v1/reanalysis");
      msg.className = "msg";
      msg.textContent = pending ? `Re-analyzing… ${total - pending} of ${total} done.` : `Done: ${total} call(s) re-analyzed.`;
      if (pending) pollTimer = setTimeout(() => poll(total), 2000); else btn.disabled = false;
    } catch (e) { if (!handle(e)) { msg.className = "msg error"; msg.textContent = e.message; btn.disabled = false; } }
  }
  return el("section", { class: "panel narrow", style: "margin-top: 16px" },
    el("h2", {}, "Re-analyze all calls"),
    el("p", { class: "help" }, "Apply the current competitor list, rules and model to every finished call, for example after changing competitors. Runs in the background."),
    el("div", { style: "margin-top: 12px" }, btn), msg);
}

// ---------------------------------------------------------------- router
async function route() {
  const signin = location.hash.match(/^#\/signin(?:\?error=(.*))?$/);
  if (signin) {
    history.replaceState(null, "", "#/");  // don't keep the error in the address bar
    showKeyForm(signin[1] ? decodeURIComponent(signin[1]) : undefined);
    return;
  }
  if (!me) {
    try { me = await api("/auth/me"); updateIdentity(); }  // signed-in session or stored key
    catch (e) {
      if (e instanceof AuthError && !getKey()) showKeyForm();  // first visit: no error, just the sign-in page
      else if (!handle(e)) app.replaceChildren(el("p", { class: "error" }, e.message));
      return;
    }
  }
  const m = location.hash.match(/^#\/calls\/([^/]+)$/);
  if (m) showCall(decodeURIComponent(m[1]));
  else if (location.hash === "#/audit") showAudit();
  else if (location.hash === "#/trends") showTrends();
  else if (location.hash === "#/settings") showSettings();
  else showCalls();
}
window.addEventListener("hashchange", route);
document.getElementById("signout").addEventListener("click", async () => {
  setKey("");
  try { await fetch("/auth/logout", { method: "POST" }); } catch {}
  showKeyForm();
});
api("/health").then(h => { document.getElementById("version").textContent = `v${h.version}`; }).catch(() => {});
route();
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callsight"
version = "0.1.0"
description = "Self-hostable, open-source conversation intelligence"
requires-python = ">=3.10"
# The analysis core has no third-party dependencies; these are only for serving the HTTP API.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
callsight = "callsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

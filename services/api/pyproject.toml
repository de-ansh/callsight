[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callsight"
version = "0.1.0"
description = "Self-hostable, open-source conversation intelligence"
requires-python = ">=3.10"
# The analysis core has no third-party dependencies; these are only for serving the HTTP API.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary]>=3.1",
  "minio>=7.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
# Local speech-to-text for the worker. Large (CTranslate2 + PyAV), so optional for API-only installs.
# av<19: faster-whisper 1.2.1 passes av.open(metadata_errors=...), which PyAV 19 removed.
asr = ["faster-whisper>=1.1", "av<19"]

[project.scripts]
callsight = "callsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
callsight = ["migrations/*.sql", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

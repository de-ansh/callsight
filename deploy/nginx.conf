# TLS, request limits and security headers in front of the Callsight API.
# Certificates: fullchain.pem and privkey.pem in CALLSIGHT_TLS_DIR (default deploy/certs).

limit_req_zone $binary_remote_addr zone=callsight:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploads are capped at 500 MB by the API too; this stops bigger bodies before they reach it.
    client_max_body_size 510m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        limit_req zone=callsight burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream uploads instead of buffering 500 MB on the proxy
        proxy_read_timeout 300s;       # re-analysis with an LLM can take a while
    }
}
